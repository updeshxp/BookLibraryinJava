spring.application.name=RestSrv
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# In-memory H2 database configuration
spring.datasource.url=jdbc:h2:mem:booklibrarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

# JPA/Hibernate settings for local IDE runs
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Optional H2 web console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
